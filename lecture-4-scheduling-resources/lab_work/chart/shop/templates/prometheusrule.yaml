{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "shop.fullname" . }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: shop-sla
      rules:
        # 1) SLA по ошибкам: критический путь не должен сыпать 5xx
        - alert: ShopApiHighErrorRate
          expr: |
            (
              sum(rate(api_http_errors_total[2m]))
              /
              clamp_min(sum(rate(api_http_requests_total[2m])), 1)
            ) > 0.05
          for: 1m
          labels:
            severity: warning
            service: shop-api
          annotations:
            summary: "Shop API error rate > 5%"
            description: "Доля 5xx на пути заказа выше 5%. Под перегрузкой должен жертвоваться batch, а не api."

        # 2) SLA по задержке: p95 не должен уезжать далеко
        - alert: ShopApiHighP95Latency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(api_http_request_duration_seconds_bucket[2m])
              )
            ) > 1
          for: 2m
          labels:
            severity: warning
            service: shop-api
          annotations:
            summary: "Shop API p95 latency > 1s"
            description: "p95 дольше 1 секунды. Это нарушение SLA критического пути."

        # 3) Доступность метрик/сервиса: если target down, SLA слепой
        - alert: ShopApiTargetDown
          expr: |
            absent(up{job="{{ include "shop.fullname" . }}-api"})
            or
            max(up{namespace="{{ .Release.Namespace }}", service="{{ include "shop.fullname" . }}-api"}) == 0
          for: 1m
          labels:
            severity: critical
            service: shop-api
          annotations:
            summary: "Shop API Prometheus target is down"
            description: "Prometheus не скрейпит api. Нет метрик и нет уверенности в SLA."
{{- end }}
