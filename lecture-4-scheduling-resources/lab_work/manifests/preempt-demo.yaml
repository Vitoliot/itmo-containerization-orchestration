apiVersion: v1
kind: Pod
metadata:
  name: preempt-demo
  namespace: app
  labels:
    app.kubernetes.io/name: preempt-demo
    app.kubernetes.io/part-of: shop
spec:
  priorityClassName: shop-high
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
      resources:
        requests:
          cpu: 100m
          memory: 1500Mi
        limits:
          cpu: 100m
          memory: 1500Mi
