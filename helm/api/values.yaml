replicaCount: 1

image:
  repository: my-api
  tag: latest
  pullPolicy: Never

service:
  type: ClusterIP
  port: 8080

env:
  - name: OTEL_SERVICE_NAME
    value: api

  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://jaeger.observability.svc.cluster.local:4317

  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: grpc

  - name: SELF_BASE_URL
    value: http://127.0.0.1:8080

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

serviceMonitor:
  enabled: true

alerts:
  enabled: true
  errorRateThreshold: 0.2
  latencyP95Seconds: 1.5
