{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: {{ include "api.fullname" . }}
  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: api

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
