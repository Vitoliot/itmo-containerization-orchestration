apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "alert-webhook.fullname" . }}

  labels:
    app: alert-webhook

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: alert-webhook

  template:
    metadata:
      labels:
        app: alert-webhook

    spec:
      containers:
        - name: alert-webhook

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: PORT
              value: "8080"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2

          resources:
            {{- toYaml .Values.resources | nindent 12 }}