{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if or .Values.networkPolicy.allowApiToPostgres .Values.networkPolicy.allowWorkerToPostgres }}
    - from:
        {{- if .Values.networkPolicy.allowApiToPostgres }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
        {{- if .Values.networkPolicy.allowWorkerToPostgres }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: worker
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.postgresPort }}}
    {{- end }}
    # CloudNativePG controller communicates with the instance manager on 8000.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.cnpgNamespace }}
      ports:
        - {protocol: TCP, port: 8000}
{{- end }}
