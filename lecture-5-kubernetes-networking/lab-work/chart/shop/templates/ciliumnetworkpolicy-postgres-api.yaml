{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.allowCnpgToKubeApi }}
# Cilium's kube-apiserver entity is safer than hard-coding kind node/service IPs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: shop-postgres-kube-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  egress:
    - toEntities:
        - kube-apiserver
{{- end }}
