{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "shop.fullname" . }}-network
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    {{- toYaml .Values.monitoring.prometheusRule.labels | nindent 4 }}
spec:
  groups:
    - name: shop-network
      rules:
        - alert: ShopPolicyDrops
          expr: |
            sum(rate(hubble_drop_total{reason=~"(?i).*policy.*denied.*",source_namespace="{{ .Release.Namespace }}"}[2m]))
            + sum(rate(hubble_drop_total{reason=~"(?i).*policy.*denied.*",destination_namespace="{{ .Release.Namespace }}"}[2m])) > 0.1
          for: 1m
          labels: {severity: warning, service: shop-network}
          annotations:
            summary: "Shop: policy denied traffic"
        - alert: ShopTcpResets
          expr: |
            sum(rate(hubble_tcp_flags_total{flag="RST",source_namespace="{{ .Release.Namespace }}"}[5m])) > 0.5
          for: 2m
          labels: {severity: warning, service: shop-network}
          annotations:
            summary: "Shop: elevated TCP resets"
        - alert: ShopDnsFailures
          expr: |
            sum(rate(hubble_dns_responses_total{source_namespace="{{ .Release.Namespace }}",rcode!~"(?i)no.?error|noerror|0"}[5m])) > 0.1
          for: 2m
          labels: {severity: warning, service: shop-network}
          annotations:
            summary: "Shop: elevated DNS errors"
{{- end }}
