{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.allowExternalNodePort }}
# External clients may reach api:8080 through NodePort; NOT intruder Pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: shop-api-nodeport
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  ingress:
    - fromEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
{{- end }}
