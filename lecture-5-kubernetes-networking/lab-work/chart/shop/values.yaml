api:
  replicaCount: 3
  image:
    repository: ghcr.io/vitoliot/shop-api
    tag: lab5
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  healthFail: false
  otelEndpoint: ""      # e.g. http://jaeger.observability:4317
  resources:
    requests: {cpu: 25m, memory: 80Mi}
    limits: {cpu: 300m, memory: 300Mi}
worker:
  replicaCount: 2
  image:
    repository: ghcr.io/vitoliot/shop-worker
    tag: lab5
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
postgres:
  enabled: true
  name: shop-postgres
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  instances: 1   # policies are designed for one instance; expand for PG replication
  storage:
    size: 1Gi
    storageClass: standard
  database: shop
  owner: shop
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
networkPolicy:
  enabled: false  # phase 1/2: no restrictions; enable AFTER baseline tests
  clientNamespace: nettest
  clientPodLabel: client
  observabilityNamespace: observability
  cnpgNamespace: cnpg-system
  postgresPort: 5432
  allowApiToPostgres: true
  allowWorkerToPostgres: true
  allowDns: true
  allowExternalNodePort: true
  allowCnpgToKubeApi: true
monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    labels: {release: kube-prometheus-stack}
  prometheusRule:
    enabled: true
    labels: {release: kube-prometheus-stack}
