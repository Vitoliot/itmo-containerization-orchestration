# Cilium v1.20.3, for kind with kube-proxy retained.
ipam:
  mode: kubernetes
kubeProxyReplacement: false
operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - "flow:labelsContext=source_namespace,destination_namespace"
      - "drop:labelsContext=source_namespace,destination_namespace"
      - "tcp:labelsContext=source_namespace,destination_namespace"
      - "dns:query;labelsContext=source_namespace,destination_namespace"
    serviceMonitor:
      enabled: false
