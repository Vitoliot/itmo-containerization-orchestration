apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.fullname" . }}-api
  labels:
    {{- include "shop.workloadLabels" (dict "Chart" .Chart "Release" .Release "workload" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
