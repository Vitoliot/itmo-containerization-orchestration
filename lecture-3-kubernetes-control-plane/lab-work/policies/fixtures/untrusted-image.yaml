apiVersion: v1
kind: Pod
metadata:
  name: policy-fixture-untrusted-image
  labels:
    app.kubernetes.io/name: policy-fixture
    app.kubernetes.io/part-of: lab3
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: docker.io/library/nginx:1.27
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        readOnlyRootFilesystem: true
