apiVersion: v1
kind: Pod
metadata:
  name: policy-fixture-writable-root
  labels:
    app.kubernetes.io/name: policy-fixture
    app.kubernetes.io/part-of: lab3
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/vitoliot/shop-api:dev
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        readOnlyRootFilesystem: false
